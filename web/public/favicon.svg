<?xml version="1.0" encoding="UTF-8"?>
<!-- The favicon uses the small-size proportions: a thicker ring and a bigger dot survive
     16 px, where the full mark's ring would collapse to a single faint pixel. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="PhoneConnect">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114.5" fill="url(#tile)"/>
  <circle cx="256" cy="256" r="161.3" fill="none" stroke="#ecfeff" stroke-width="35.8"/>
  <circle cx="256" cy="256" r="129.0" fill="#2dd4bf"/>
  <circle cx="256" cy="256" r="64.5" fill="#ecfeff"/>
</svg>

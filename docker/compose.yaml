# PhoneConnect server and relay.
#
# Environment (export these, or put them in an untracked .env next to this file):
#   PHONECONNECT_ADMIN_TOKEN  Required. Compose refuses to start without it.
#   PHONECONNECT_PUBLIC_URL   The origin clients dial. Defaults to
#                             http://127.0.0.1:8080 for a local run; a real deployment sets
#                             it to the public HTTPS origin behind its TLS proxy, because the
#                             server advertises this value as the relay base.
services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: phoneconnect-server:dev
    environment:
      # Required: compose refuses to start without it, so no deployment inherits a
      # publicly known bootstrap token. Generate one with `openssl rand -base64 32`.
      PHONECONNECT_ADMIN_TOKEN: ${PHONECONNECT_ADMIN_TOKEN:?set PHONECONNECT_ADMIN_TOKEN to a random admin bearer token}
      PHONECONNECT_PUBLIC_URL: ${PHONECONNECT_PUBLIC_URL:-http://127.0.0.1:8080}
      # Persisted, so a restart does not rotate the key native clients pinned.
      PHONECONNECT_TICKET_KEY_PATH: /data/ticket-signing-key
    ports:
      # Loopback only: a deployment reaches the server through its TLS-terminating
      # reverse proxy, never directly on all interfaces.
      - "127.0.0.1:8080:8080"
    volumes:
      - phoneconnect-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  phoneconnect-data:

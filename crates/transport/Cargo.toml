[package]
name = "phoneconnect-transport"
description = "PhoneConnect path transport: candidate discovery, authenticated hole punching, and relay fallback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "phoneconnect_transport"
path = "src/lib.rs"

[dependencies]
base64 = "0.22.1"
phoneconnect-protocol = { path = "../protocol" }
async-trait = "0.1.92"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hmac = "0.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
phoneconnect-server = { path = "../../server" }
tokio = { version = "1.54.1", features = ["full"] }

[[bin]]
name = "path-stub"
path = "src/bin/path_stub.rs"
test = false

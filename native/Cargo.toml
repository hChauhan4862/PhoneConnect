[package]
name = "phoneconnect-native"
description = "PhoneConnect native shell: loads the server-served web UI unchanged and exposes loopback proxy endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "phoneconnect_native"
path = "src/lib.rs"

[[bin]]
name = "phoneconnect-native"
path = "src/main.rs"

[features]
default = []
# The Tauri shell. Off by default so `cargo test -p phoneconnect-native` needs no display and
# no webview system libraries; the desktop binary is built with `--features shell`.
shell = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification"]

[dependencies]
phoneconnect-protocol = { path = "../crates/protocol" }
phoneconnect-transport = { path = "../crates/transport" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.154"
thiserror.workspace = true
tokio = { version = "1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "sync",
    "time",
] }
url = "2"
tauri = { version = "2.12.5", features = ["image-png", "tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-notification = { version = "2.8.1", optional = true }

[build-dependencies]
tauri-build = "2.7.4"

[dev-dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
phoneconnect-server = { path = "../server" }
tokio = { version = "1.54.1", features = ["full"] }

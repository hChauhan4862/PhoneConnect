<?xml version="1.0" encoding="UTF-8"?>
<!-- PhoneConnect. Geometry is the shipped mark: the outer ring is r=179.2 of a 512 tile,
     and scripts/generate-icons.py derives every raster size from these same proportions. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="PhoneConnect">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114.5" fill="url(#tile)"/>
  <circle cx="256" cy="256" r="165.2" fill="none" stroke="#ecfeff" stroke-width="28"/>
  <circle cx="256" cy="256" r="129.1" fill="#2dd4bf"/>
  <circle cx="256" cy="256" r="59.1" fill="#ecfeff"/>
</svg>

name: Release

# Publish by creating the release in the GitHub UI: publishing it fires `release: published`
# and this workflow attaches the artifacts to *that* release, leaving the notes you wrote
# alone. `workflow_dispatch` is the escape hatch for an existing tag; it creates the release
# only when one does not exist yet. Nothing is published from a branch push.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (the release is created if it is missing)
        required: true

permissions:
  contents: write   # create the release and upload assets
  packages: write   # push the server image to GHCR

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}/server
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  # Everything must be green before a single artifact is published.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web checks
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install the SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android unit tests and lint
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

  # One image per architecture on that architecture's own runner, then one multi-arch manifest.
  # Emulating the other architecture under QEMU would multiply the build time of a Rust and a
  # Node compile for no benefit, and both runners are available to this public repository.
  image:
    name: Publish the server image (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The per-platform tags this build pushes; the manifest step re-tags the result.
          flavor: |
            suffix=-${{ matrix.arch }}
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # The digest, not a tag: the tag says nothing about which platform it holds.
      - name: Record the digest for the manifest
        run: |
          set -euo pipefail
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}.txt"
          cat "digests/${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}.txt
          if-no-files-found: error

  # Publishes `<version>`, `<major>.<minor>` and `latest` as one manifest listing both images,
  # so a host pulls whatever matches its own architecture.
  image-manifest:
    name: Publish the multi-arch manifest
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine the per-architecture images
        env:
          RAW_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # Registry references are lower-case; the repository name is not.
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          version="${RAW_TAG#v}"
          minor="${version%.*}"
          amd64="$(cat digests/amd64.txt)"
          arm64="$(cat digests/arm64.txt)"
          test -n "$amd64"
          test -n "$arm64"

          # A pre-release such as 2.0.0-rc.1 must not take `latest` from the stable line.
          tags=(--tag "${image}:${version}" --tag "${image}:${minor}")
          case "$version" in
            *-*) echo "pre-release: not tagging latest" ;;
            *) tags+=(--tag "${image}:latest") ;;
          esac

          docker buildx imagetools create "${tags[@]}" \
            "${image}@${amd64}" \
            "${image}@${arm64}"

      - name: Show what was published
        env:
          RAW_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "${image}:${RAW_TAG#v}"

  android:
    name: Agent APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      # The runner image ships the command-line tools but not the platform, so the job that
      # actually builds the APKs installs it, exactly as `verify` and CI do.
      - name: Install the SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      # A signed release needs four repository secrets. `secrets` is not an allowed context in a
      # step-level `if:`, so presence is detected here and published as a step output. Without the
      # secrets the unsigned APK is published instead: installable, but not upgradeable in place.
      - name: Detect signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Android signing secrets; publishing an unsigned release APK."
          fi

      - name: Sign the release APK
        if: steps.signing.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.p12
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" sign --ks /tmp/release.p12 --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  native:
    name: Desktop shell (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: phoneconnect-linux-x86_64
            binary: target/release/phoneconnect-native
          - os: macos-latest
            asset: phoneconnect-macos-aarch64
            binary: target/release/phoneconnect-native
          - os: windows-latest
            asset: phoneconnect-windows-x86_64.exe
            binary: target/release/phoneconnect-native.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # crates/protocol/build.rs shells out to protoc on every platform.
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev build-essential patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.os }}

      - run: cargo build --release --features shell -p phoneconnect-native

      - name: Stage the asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Runs only after the image, the APKs and every shell binary have been produced.
  publish:
    name: Attach the artifacts to the release
    needs: [image-manifest, android, native]
    if: ${{ always() && needs.image-manifest.result == 'success' && needs.android.result == 'success' && needs.native.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `gh` resolves the repository from the working tree, and `--verify-tag` resolves the
      # tag there too; without a checkout both fail with "not a git repository".
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      # Only the artifacts that become release assets. Downloading everything also pulls the
      # Docker build-record artifact, which is not published and once failed the whole job.
      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release
          merge-multiple: true

      - name: Download the shell binaries
        uses: actions/download-artifact@v4
        with:
          pattern: phoneconnect-*
          path: release
          merge-multiple: true

      - name: Check there is something to publish
        run: |
          set -euo pipefail
          ls -l release
          test -n "$(ls -A release)" || { echo "no assets were downloaded"; exit 1; }

      # The release you created in the UI is reused as-is: only assets are attached, so the
      # notes and the draft/published state stay yours. A release is created only when the
      # tag exists but has no release yet (the `workflow_dispatch` path).
      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Second belt: `gh` never has to infer the repository from the checkout.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; attaching the assets to it."
            gh release upload "$tag" release/* --clobber
            exit 0
          fi

          echo "No release for $tag yet; creating it from the existing tag."
          # A quoted heredoc: this text is markdown, so its backticks must stay literal.
          cat > notes.md <<'NOTES'
          ## Install

          - **Server:** `docker run -v phoneconnect-data:/data -e PHONECONNECT_ADMIN_TOKEN=<random> -e PHONECONNECT_PUBLIC_URL=https://your-origin -p 127.0.0.1:8080:8080 ghcr.io/@REPOSITORY@/server:@IMAGE_TAG@`
          - **Android agent:** `app-debug.apk` (debug-signed) or `app-release-*.apk`.
          - **Desktop shell:** the `phoneconnect-*` binary for your platform. It loads the server UI you configure; it is not a second UI.

          See `docs/capabilities.md` for exactly which device commands an ordinary Android app can perform, and which are refused by the platform.
          NOTES
          # Portable in-place rewrite: BSD `sed -i` needs an argument that GNU rejects.
          sed "s|@REPOSITORY@|${{ github.repository }}|; s|@IMAGE_TAG@|${tag#v}|" notes.md > notes.tmp
          mv notes.tmp notes.md

          # A leading tag such as `v1.0.0-rc.1` is a pre-release, exactly as semver intends.
          case "$tag" in
            *-*)
              gh release create "$tag" release/* --title "PhoneConnect $tag" \
                --notes-file notes.md --verify-tag --prerelease
              ;;
            *)
              gh release create "$tag" release/* --title "PhoneConnect $tag" \
                --notes-file notes.md --verify-tag
              ;;
          esac

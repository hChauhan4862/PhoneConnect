name: Release

# Tag a commit (for example `v0.2.0`) to publish the server image, the agent APKs and the
# desktop shell binaries. Nothing is published from a branch push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write   # create the release and upload assets
  packages: write   # push the server image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}/server

jobs:
  # Everything must be green before a single artifact is published.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web checks
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Android unit tests and lint
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

  image:
    name: Publish the server image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  android:
    name: Agent APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      # A signed release needs four repository secrets. Without them this step is skipped and
      # the unsigned APK is published instead, which is installable but not upgradeable in place.
      - name: Sign the release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.p12
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" sign --ks /tmp/release.p12 --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  native:
    name: Desktop shell (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: phoneconnect-linux-x86_64
            binary: target/release/phoneconnect-native
          - os: macos-latest
            asset: phoneconnect-macos-aarch64
            binary: target/release/phoneconnect-native
          - os: windows-latest
            asset: phoneconnect-windows-x86_64.exe
            binary: target/release/phoneconnect-native.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev build-essential patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.os }}

      - run: cargo build --release --features shell -p phoneconnect-native

      - name: Stage the asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Create the release
    needs: [image, android, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble the asset list
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.apk' -o -name 'phoneconnect-*' \) -exec cp {} release/ \;
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: PhoneConnect ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Install

            - **Server:** `docker run -v phoneconnect-data:/data -e PHONECONNECT_ADMIN_TOKEN=<random> -e PHONECONNECT_PUBLIC_URL=https://your-origin -p 127.0.0.1:8080:8080 ghcr.io/${{ github.repository }}/server:${{ github.event.inputs.tag || github.ref_name }}`
            - **Android agent:** `app-debug.apk` (debug-signed) or `app-release-*.apk`.
            - **Desktop shell:** the `phoneconnect-*` binary for your platform. It loads the server UI you configure; it is not a second UI.

            See `docs/capabilities.md` for exactly which device commands an ordinary Android app can perform, and which are refused by the platform.
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

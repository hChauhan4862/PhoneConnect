name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default: no CI job may write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-linux

      # rustfmt is not enforced repository-wide yet, so formatting is not a gate.
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      # The runner image ships build-tools but not the platform. AGP 8.9.1 picks build-tools
      # 35.0.0 by default (no buildToolsVersion is set), so that is the revision to pin.
      - name: Install the SDK platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Proves R8 and the release manifest; signing is deliberately not configured here.
      - name: Assemble release APK (unsigned)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: phoneconnect-agent-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # The shell loads a webview, so it is built with the `shell` feature; the default
  # test profile stays free of webview system libraries.
  native:
    name: Native shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: phoneconnect-linux-x86_64
            binary: target/release/phoneconnect-native
          - os: macos-latest
            artifact: phoneconnect-macos-aarch64
            binary: target/release/phoneconnect-native
          - os: windows-latest
            artifact: phoneconnect-windows-x86_64
            binary: target/release/phoneconnect-native.exe
    steps:
      - uses: actions/checkout@v4

      # crates/protocol/build.rs shells out to protoc, so every OS needs it.
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev             librsvg2-dev libsoup-3.0-dev libssl-dev build-essential patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.os }}

      - name: Build the shell
        run: cargo build --release --features shell -p phoneconnect-native

      # Proves the URL policy and the injected host context without starting a webview.
      - name: Smoke the host context
        shell: bash
        env:
          PHONECONNECT_SERVER_URL: https://phoneconnect.example
        run: |
          set -euo pipefail
          BIN=target/release/phoneconnect-native
          [ -f "$BIN" ] || BIN="$BIN.exe"
          "$BIN" --print-context > context.json
          cat context.json
          # Parse the document instead of grepping its formatting: the assertions are about
          # the values, not about how serde_json happens to pretty-print them.
          python3 - context.json <<'PY'
          import json, sys
          context = json.load(open(sys.argv[1]))
          assert context["kind"] == "native", context
          assert "phoneconnect.example" in context["serverUrl"], context
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: phoneconnect-server:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack and prove it serves the UI and the API
        run: |
          set -euo pipefail
          PHONECONNECT_ADMIN_TOKEN=ci-smoke-token docker compose -p pc-ci -f docker/compose.yaml up -d --no-build --force-recreate
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

          # The one UI is served by the server; a deep route returns the same document.
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<!doctype html'
          curl -fsS http://127.0.0.1:8080/devices/abc | grep -qi '<!doctype html'
          # An unknown API path is a JSON 404, never the SPA.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/nope)" = "404"
          # Strict transport-ish headers are present on the document.
          curl -fsSI http://127.0.0.1:8080/ | grep -qi 'content-security-policy'

          # Enrollment and a session round-trip through the real server.
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8080/api/enrollment-tokens             -H "Authorization: Bearer ci-smoke-token" -H 'Content-Type: application/json'             -d '{"owner_id":"ci"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')
          test -n "$TOKEN"
          ENROLLED=$(curl -fsS -X POST http://127.0.0.1:8080/api/devices/enroll             -H 'Content-Type: application/json' -d "{\"token\":\"$TOKEN\"}")
          echo "$ENROLLED" | grep -q '"device_id"'
          curl -fsS -H "Authorization: Bearer ci-smoke-token" http://127.0.0.1:8080/api/devices | grep -q '"state":"enrolled"'

      - name: Logs on failure
        if: failure()
        run: docker compose -p pc-ci -f docker/compose.yaml logs --no-color | tail -100

      - name: Stop the stack
        if: always()
        run: docker compose -p pc-ci -f docker/compose.yaml down -v

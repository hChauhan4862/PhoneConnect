# Dependency updates for every ecosystem this repository ships.
#
# Grouping is deliberate: one pull request per ecosystem per week instead of one per crate.
# Every pull request runs the full CI matrix, so a flood of individual updates would be the
# single largest consumer of runner minutes.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Base images move slowly; checking monthly is enough and keeps PR noise down.
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
